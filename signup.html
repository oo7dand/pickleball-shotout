<!DOCTYPE html>
<html>

<head>
  <title>Pickleball Shootout - Sign Up</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
      margin-top: 0;
      color: #14532d;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #15803d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #166534;
    }

    #message {
      margin-top: 16px;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>Create Account</h1>

  <input
    id="username"
    type="text"
    placeholder="Username"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button onclick="signup()">
    Create Account
  </button>

  <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://giqwhoiyqxmydjaicuno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2561Ydz1YiLOlCDcWCY0qw_jwQMK_8b";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function signup() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if(!username || !password) {

    message.innerText =
      "Enter username and password";

    return;
  }

  const fakeEmail =
    username + "@shootout.local";

  const { data, error } =
    await supabaseClient.auth.signUp({

      email: fakeEmail,
      password: password

    });

  if(error) {

    message.innerText =
      error.message;

  } else {

    message.innerText =
      "Account created successfully!";

  }

}

</script>

</body>
</html>
