<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>

  <style>
    body {
      font-family: Arial;
      background:#f4f7f4;
      max-width:1200px;
      margin:40px auto;
      padding:20px;
    }

    .card {
      background:white;
      padding:24px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
      color:#14532d;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    th, td {
      padding:10px;
      border-bottom:1px solid #ddd;
      text-align:left;
    }

    input {
      width:80px;
      padding:6px;
    }

    button {
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#14532d;
      color:white;
    }

    .court {
      margin-top:20px;
      padding:16px;
      border:1px solid #ddd;
      border-radius:8px;
    }

    .match {
      border:1px solid #ddd;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
    }

    .playerRow {
      padding:8px 0;
      border-bottom:1px solid #eee;
    }
  </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<div class="card">

  <h2>Court Generator</h2>

  <button onclick="generateCourts()">
    Generate Courts
  </button>

  <div id="courtsContainer"></div>

</div>

<div class="card">

  <h2>Match Entry</h2>

  <div id="matchesContainer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://giqwhoiyqxmydjaicuno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2561Ydz1YiLOlCDcWCY0qw_jwQMK_8b";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentSession = null;
let allPlayers = [];
let signupMap = {};
let activePlayers = [];

async function initialize() {

  const { data: session } =
    await supabaseClient
      .from("sessions")
      .select("*")
      .order("session_date", { ascending: true })
      .limit(1)
      .single();

  currentSession = session;

  const { data: profiles } =
    await supabaseClient
      .from("profiles")
      .select("*");

  const { data: signups } =
    await supabaseClient
      .from("session_signups")
      .select("*")
      .eq("session_date", currentSession.session_date);

  signupMap = {};

  signups.forEach(signup => {
    signupMap[signup.user_id] = signup.status;
  });

  allPlayers = profiles;

  activePlayers =
    profiles
      .filter(player =>
        signupMap[player.id] === "in"
      )
      .sort((a, b) =>
        a.ladder_rank - b.ladder_rank
      );
}

function generateCourts() {

  const container =
    document.getElementById("courtsContainer");

  const matchesContainer =
    document.getElementById("matchesContainer");

  container.innerHTML = "";
  matchesContainer.innerHTML = "";

  const playersPerCourt = 5;

  for(let i = 0; i < activePlayers.length; i += playersPerCourt) {

    const courtPlayers =
      activePlayers.slice(i, i + playersPerCourt);

    const courtNumber =
      (i / playersPerCourt) + 1;

    let courtHtml = `
      <div class="court">
        <h3>Court ${courtNumber}</h3>
    `;

    courtPlayers.forEach(player => {

      courtHtml += `
        <div class="playerRow">
          #${player.ladder_rank}
          —
          ${player.username}
          ${
            player.dupr
              ? `(DUPR ${player.dupr})`
              : ""
          }
        </div>
      `;
    });

    courtHtml += `</div>`;

    container.innerHTML += courtHtml;

    generateMatches(
      courtPlayers,
      courtNumber
    );
  }

}

function generateMatches(players, courtNumber) {

  if(players.length < 5) {
    return;
  }

  const rounds = [

    {
      round: 1,
      team1: [0,1],
      team2: [2,3],
      bye: 4
    },

    {
      round: 2,
      team1: [0,2],
      team2: [1,4],
      bye: 3
    },

    {
      round: 3,
      team1: [0,3],
      team2: [2,4],
      bye: 1
    },

    {
      round: 4,
      team1: [0,4],
      team2: [1,3],
      bye: 2
    },

    {
      round: 5,
      team1: [1,2],
      team2: [3,4],
      bye: 0
    }

  ];

  const matchesContainer =
    document.getElementById("matchesContainer");

  let html =
    `<div class="court">
      <h3>Court ${courtNumber} Matches</h3>`;

  rounds.forEach(r => {

    const t1p1 =
      players[r.team1[0]];

    const t1p2 =
      players[r.team1[1]];

    const t2p1 =
      players[r.team2[0]];

    const t2p2 =
      players[r.team2[1]];

    const bye =
      players[r.bye];

    html += `
      <div class="match">

        <strong>
          Round ${r.round}
        </strong>

        <p>
          ${t1p1.username}
          /
          ${t1p2.username}

          vs

          ${t2p1.username}
          /
          ${t2p2.username}
        </p>

        <p>
          Bye:
          ${bye.username}
        </p>

        <input
          id="score1-${courtNumber}-${r.round}"
          type="number"
          placeholder="Team 1"
        >

        <input
          id="score2-${courtNumber}-${r.round}"
          type="number"
          placeholder="Team 2"
        >

        <button
          onclick="saveMatch(
            ${courtNumber},
            ${r.round},
            '${t1p1.id}',
            '${t1p2.id}',
            '${t2p1.id}',
            '${t2p2.id}',
            '${bye.id}'
          )"
        >
          Save Match
        </button>

      </div>
    `;
  });

  html += `</div>`;

  matchesContainer.innerHTML += html;
}

async function saveMatch(
  courtNumber,
  roundNumber,
  t1p1,
  t1p2,
  t2p1,
  t2p2,
  bye
) {

  const score1 =
    Number(
      document.getElementById(
        `score1-${courtNumber}-${roundNumber}`
      ).value
    );

  const score2 =
    Number(
      document.getElementById(
        `score2-${courtNumber}-${roundNumber}`
      ).value
    );

  const { error } =
    await supabaseClient
      .from("matches")
      .insert({

        session_date:
          currentSession.session_date,

        court_number:
          courtNumber,

        round_number:
          roundNumber,

        team1_player1:
          t1p1,

        team1_player2:
          t1p2,

        team2_player1:
          t2p1,

        team2_player2:
          t2p2,

        bye_player:
          bye,

        team1_score:
          score1,

        team2_score:
          score2

      });

  if(error) {

    alert(error.message);

  } else {

    alert(
      "Match saved"
    );
  }

}

initialize();

</script>

</body>
</html>
