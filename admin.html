<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f7f4;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
      color: #14532d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    .in {
      color: green;
      font-weight: bold;
    }

    .out {
      color: red;
      font-weight: bold;
    }

    .waitlist {
      color: #334155;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<div class="card">

  <h2>Current Session Signups</h2>

  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>Status</th>
        <th>Session</th>
      </tr>
    </thead>

    <tbody id="signupTable"></tbody>
  </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://giqwhoiyqxmydjaicuno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2561Ydz1YiLOlCDcWCY0qw_jwQMK_8b";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function loadSignups() {

  const { data, error } =
    await supabaseClient
      .from("session_signups")
      .select(`
        *,
        profiles (
          username
        )
      `)
      .order("created_at", { ascending: false });

  if(error) {
    console.log(error);

    document.getElementById("signupTable").innerHTML =
      `
        <tr>
          <td colspan="3">
            Error loading signups: ${error.message}
          </td>
        </tr>
      `;

    return;
  }

  const table =
    document.getElementById("signupTable");

  table.innerHTML = "";

  data.forEach(signup => {

    const playerName =
      signup.profiles?.username || signup.user_id;

    table.innerHTML += `
      <tr>
        <td>${playerName}</td>
        <td class="${signup.status}">
          ${signup.status}
        </td>
        <td>${signup.session_date}</td>
      </tr>
    `;

  });

}

loadSignups();

</script>

</body>
</html>
