<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>

  <style>
    body {
      font-family: Arial;
      background:#f4f7f4;
      max-width:1100px;
      margin:40px auto;
      padding:20px;
    }

    .card {
      background:white;
      padding:24px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
      color:#14532d;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    th, td {
      padding:12px;
      border-bottom:1px solid #ddd;
      text-align:left;
    }

    .in {
      color:green;
      font-weight:bold;
    }

    .out {
      color:red;
      font-weight:bold;
    }

    .waitlist {
      color:#334155;
      font-weight:bold;
    }

    button {
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#14532d;
      color:white;
    }

    .court {
      margin-top:20px;
      padding:16px;
      border:1px solid #ddd;
      border-radius:8px;
    }

    .playerRow {
      padding:8px 0;
      border-bottom:1px solid #eee;
    }
  </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<p>
  <a href="players.html">View Players</a>
</p>

<div class="card">

  <h2>Current Session</h2>

  <div id="sessionInfo">
    Loading...
  </div>

</div>

<div class="card">

  <h2>Signups</h2>

  <div id="summaryInfo"></div>

  <table>

    <thead>
      <tr>
        <th>Player</th>
        <th>DUPR</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="signupTable"></tbody>

  </table>

</div>

<div class="card">

  <h2>Court Assignments</h2>

  <button onclick="generateCourts()">
    Generate Courts
  </button>

  <div id="courtsContainer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://giqwhoiyqxmydjaicuno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2561Ydz1YiLOlCDcWCY0qw_jwQMK_8b";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentSession = null;
let currentPlayers = [];

async function loadSession() {

  const { data, error } =
    await supabaseClient
      .from("sessions")
      .select("*")
      .order("session_date", { ascending: true })
      .limit(1)
      .single();

  if(error) {

    document.getElementById("sessionInfo").innerText =
      "No session found.";

    return;
  }

  currentSession = data;

  document.getElementById("sessionInfo").innerText =
    data.title +
    " — " +
    data.session_date +
    " — " +
    data.start_time;

  loadSignups();
}

async function loadSignups() {

  const { data: signups, error } =
    await supabaseClient
      .from("session_signups")
      .select("*")
      .eq("session_date", currentSession.session_date);

  if(error) {
    console.log(error);
    return;
  }

  const { data: profiles } =
    await supabaseClient
      .from("profiles")
      .select("*");

  const profileMap = {};

  profiles.forEach(profile => {
    profileMap[profile.id] = profile;
  });

  const table =
    document.getElementById("signupTable");

  table.innerHTML = "";

  currentPlayers = [];

  signups.forEach(signup => {

    const player =
      profileMap[signup.user_id];

    if(!player) {
      return;
    }

    if(signup.status === "in") {

      currentPlayers.push(player);

    }

    table.innerHTML += `
      <tr>
        <td>${player.username}</td>

        <td>
          ${
            player.dupr
              ? `
                <a
                  href="${player.dupr_link || '#'}"
                  target="_blank"
                >
                  ${player.dupr}
                </a>
              `
              : "-"
          }
        </td>

        <td class="${signup.status}">
          ${signup.status}
        </td>
      </tr>
    `;

  });

  currentPlayers.sort((a, b) => {
    return a.ladder_rank - b.ladder_rank;
  });

  document.getElementById("summaryInfo").innerText =
    currentPlayers.length +
    " players currently IN";
}

function generateCourts() {

  const container =
    document.getElementById("courtsContainer");

  container.innerHTML = "";

  const playersPerCourt = 5;

  for(let i = 0; i < currentPlayers.length; i += playersPerCourt) {

    const courtPlayers =
      currentPlayers.slice(i, i + playersPerCourt);

    const courtNumber =
      (i / playersPerCourt) + 1;

    let html = `
      <div class="court">
        <h3>Court ${courtNumber}</h3>
    `;

    courtPlayers.forEach(player => {

      html += `
        <div class="playerRow">
          #${player.ladder_rank}
          —
          ${player.username}
          ${
            player.dupr
              ? `(DUPR ${player.dupr})`
              : ""
          }
        </div>
      `;

    });

    html += `</div>`;

    container.innerHTML += html;
  }

}

loadSession();

</script>

</body>
</html>
