<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>

  <style>
    body { font-family: Arial; background:#f4f7f4; max-width:1200px; margin:40px auto; padding:20px; }
    .card { background:white; padding:24px; border-radius:12px; margin-bottom:20px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
    h1 { color:#14532d; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }
    input { width:80px; padding:6px; }
    .wide { width:160px; }
    button { padding:8px 12px; border:none; border-radius:6px; cursor:pointer; background:#14532d; color:white; }
    .in { color:green; font-weight:bold; }
    .out { color:red; font-weight:bold; }
    .waitlist { color:#334155; font-weight:bold; }
    .court { margin-top:20px; padding:16px; border:1px solid #ddd; border-radius:8px; }
    .playerRow { padding:8px 0; border-bottom:1px solid #eee; }
    #saveMessage { font-weight:bold; margin-top:12px; }
  </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<p>
  <a href="players.html">View Players</a>
</p>

<div class="card">
  <h2>Current Session</h2>
  <div id="sessionInfo">Loading...</div>
</div>

<div class="card">
  <h2>Manage Players</h2>
  <p>Edit ladder rank and waitlist position here. DUPR is display only.</p>

  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>DUPR</th>
        <th>DUPR Link</th>
        <th>Ladder Rank</th>
        <th>Waitlist</th>
        <th>Status</th>
        <th>Save</th>
      </tr>
    </thead>

    <tbody id="playersTable"></tbody>
  </table>

  <div id="saveMessage"></div>
</div>

<div class="card">
  <h2>Court Assignments</h2>

  <button onclick="generateCourts()">
    Generate Courts
  </button>

  <div id="courtsContainer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://giqwhoiyqxmydjaicuno.supabase.co";
const SUPABASE_KEY = "sb_publishable_2561Ydz1YiLOlCDcWCY0qw_jwQMK_8b";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentSession = null;
let allPlayers = [];
let signupMap = {};

async function loadSession() {
  const { data, error } = await supabaseClient
    .from("sessions")
    .select("*")
    .order("session_date", { ascending: true })
    .limit(1)
    .single();

  if (error) {
    document.getElementById("sessionInfo").innerText = "No session found.";
    return;
  }

  currentSession = data;

  document.getElementById("sessionInfo").innerText =
    data.title + " — " + data.session_date + " — " + data.start_time;

  loadPlayersAndSignups();
}

async function loadPlayersAndSignups() {
  const { data: profiles, error: profileError } = await supabaseClient
    .from("profiles")
    .select("*")
    .order("ladder_rank", { ascending: true });

  if (profileError) {
    document.getElementById("playersTable").innerHTML =
      "<tr><td colspan='7'>Error loading players: " + profileError.message + "</td></tr>";
    return;
  }

  const { data: signups } = await supabaseClient
    .from("session_signups")
    .select("*")
    .eq("session_date", currentSession.session_date);

  signupMap = {};

  if (signups) {
    signups.forEach(signup => {
      signupMap[signup.user_id] = signup.status;
    });
  }

  allPlayers = profiles || [];

  renderPlayers();
}

function renderPlayers() {
  const table = document.getElementById("playersTable");
  table.innerHTML = "";

  allPlayers.forEach(player => {
    const status = signupMap[player.id] || "-";

    table.innerHTML += `
      <tr>
        <td>${player.username || "-"}</td>

        <td>
          <input
            id="dupr-${player.id}"
            type="number"
            step="0.01"
            value="${player.dupr || ""}"
          >
        </td>

        <td>
          <input
            class="wide"
            id="duprlink-${player.id}"
            type="text"
            value="${player.dupr_link || ""}"
          >
        </td>

        <td>
          <input
            id="rank-${player.id}"
            type="number"
            value="${player.ladder_rank || ""}"
          >
        </td>

        <td>
          <input
            id="wait-${player.id}"
            type="number"
            value="${player.waitlist_position || ""}"
          >
        </td>

        <td class="${status}">
          ${status}
        </td>

        <td>
          <button onclick="savePlayer('${player.id}')">
            Save
          </button>
        </td>
      </tr>
    `;
  });
}

async function savePlayer(playerId) {
  const duprRaw = document.getElementById("dupr-" + playerId).value;
  const duprLink = document.getElementById("duprlink-" + playerId).value.trim();
  const rankRaw = document.getElementById("rank-" + playerId).value;
  const waitRaw = document.getElementById("wait-" + playerId).value;

  const dupr = duprRaw === "" ? null : Number(duprRaw);
  const ladderRank = rankRaw === "" ? null : Number(rankRaw);
  const waitlistPosition = waitRaw === "" ? null : Number(waitRaw);

  const { error } = await supabaseClient
    .from("profiles")
    .update({
      dupr: dupr,
      dupr_link: duprLink,
      ladder_rank: ladderRank,
      waitlist_position: waitlistPosition
    })
    .eq("id", playerId);

  if (error) {
    document.getElementById("saveMessage").innerText =
      "Error: " + error.message;
  } else {
    document.getElementById("saveMessage").innerText =
      "Player saved.";

    loadPlayersAndSignups();
  }
}

function generateCourts() {
  const container = document.getElementById("courtsContainer");
  container.innerHTML = "";

  const activePlayers = allPlayers
    .filter(player => signupMap[player.id] === "in")
    .filter(player => player.ladder_rank !== null)
    .sort((a, b) => a.ladder_rank - b.ladder_rank);

  const playersPerCourt = 5;

  for (let i = 0; i < activePlayers.length; i += playersPerCourt) {
    const courtPlayers = activePlayers.slice(i, i + playersPerCourt);
    const courtNumber = (i / playersPerCourt) + 1;

    let html = `
      <div class="court">
        <h3>Court ${courtNumber}</h3>
    `;

    courtPlayers.forEach(player => {
      html += `
        <div class="playerRow">
          #${player.ladder_rank}
          —
          ${player.username}
          ${player.dupr ? `(DUPR ${player.dupr})` : ""}
        </div>
      `;
    });

    html += `</div>`;
    container.innerHTML += html;
  }

  if (activePlayers.length === 0) {
    container.innerHTML = "<p>No active players marked IN with ladder ranks.</p>";
  }
}

loadSession();
</script>

</body>
</html>
