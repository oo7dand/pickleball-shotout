<!DOCTYPE html>
<html>
<head>
  <title>Players</title>

  <style>
    body {
      font-family: Arial;
      background:#f4f7f4;
      max-width:1000px;
      margin:40px auto;
      padding:20px;
    }

    .card {
      background:white;
      padding:24px;
      border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
      color:#14532d;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    th, td {
      padding:12px;
      border-bottom:1px solid #ddd;
      text-align:left;
    }

    a {
      color:#14532d;
    }
  </style>
</head>

<body>

<h1>Players</h1>

<div class="card">

  <table>

    <thead>
      <tr>
        <th>Player</th>
        <th>DUPR</th>
        <th>Ladder Rank</th>
        <th>Waitlist</th>
      </tr>
    </thead>

    <tbody id="playersTable"></tbody>

  </table>

</div>

<p>
  <a href="admin.html">Back to Admin</a>
</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://giqwhoiyqxmydjaicuno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2561Ydz1YiLOlCDcWCY0qw_jwQMK_8b";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function loadPlayers() {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .order("ladder_rank", { ascending: true });

  const table =
    document.getElementById("playersTable");

  if (error) {

    table.innerHTML =
      `
        <tr>
          <td colspan="4">
            Error loading players:
            ${error.message}
          </td>
        </tr>
      `;

    return;
  }

  table.innerHTML = "";

  data.forEach(player => {

    const duprDisplay =
      player.dupr
        ? `
            <a
              href="${player.dupr_link || '#'}"
              target="_blank"
            >
              ${player.dupr}
            </a>
          `
        : "-";

    table.innerHTML += `
      <tr>
        <td>${player.username || "-"}</td>

        <td>${duprDisplay}</td>

        <td>${player.ladder_rank || "-"}</td>

        <td>${player.waitlist_position || "-"}</td>
      </tr>
    `;

  });

}

loadPlayers();

</script>

</body>
</html>
